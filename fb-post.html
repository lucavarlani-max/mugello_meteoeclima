<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crea post · Mugello Meteo & Clima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{--bg:#f4f6f2;--panel:#fff;--ink:#16261f;--ink-soft:#48584f;--line:#e3e8e1;
    --pine:#0f6b52;--pine-deep:#0a4f3c;--sky:#2f7cc4;--amber:#c9671f;
    --sans:"IBM Plex Sans",system-ui,sans-serif;--serif:"Bricolage Grotesque",sans-serif;--mono:"IBM Plex Mono",monospace;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1613;--panel:#16211c;--ink:#eaf2ec;--ink-soft:#adbcb2;--line:#26332c;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:20px}
  .wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
  h1{font-family:var(--serif);font-weight:800;letter-spacing:-.02em;font-size:24px;margin:0 0 2px}
  .lead{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
  .head{grid-column:1 / -1}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:0 10px 30px -18px rgba(16,38,31,.4);display:flex;justify-content:center}
  canvas{width:100%;height:auto;max-width:420px;border-radius:10px;display:block}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px -16px rgba(16,38,31,.35)}
  .panel h2{font-family:var(--serif);font-size:15px;margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:12px 0 5px;font-weight:600}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:70px;border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:9px 10px;border-radius:9px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
  select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
    color:var(--ink);font-family:var(--sans);font-size:14px}
  .btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--pine);color:#fff;
    font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer}
  .btn.alt{background:transparent;color:var(--pine);border:1px solid var(--pine)}
  .cap{width:100%;height:120px;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;resize:vertical}
  .status{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px}
  a.back{display:inline-block;margin-top:16px;color:var(--pine);font-size:13px;font-weight:600;text-decoration:none}
  @media (max-width:760px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Crea post per Facebook</h1>
      <p class="lead">Genera l'immagine-previsione del Mugello pronta da scaricare e pubblicare. Dati Open-Meteo, aggiornati al momento.</p>
    </div>

    <div class="stage"><canvas id="cv" width="1080" height="1350"></canvas></div>

    <div class="panel">
      <h2>Impostazioni</h2>
      <label>Formato</label>
      <div class="seg" id="fmt">
        <button data-f="1080x1350" class="on">Verticale</button>
        <button data-f="1080x1080">Quadrato</button>
      </div>
      <label>Giorno</label>
      <div class="seg" id="day">
        <button data-d="0" class="on">Oggi</button>
        <button data-d="1">Domani</button>
      </div>
      <label>Titolo</label>
      <input id="titolo" value="Meteo Mugello">
      <label>Pagina (piè di pagina)</label>
      <input id="handle" value="Mugello Meteo & Clima">

      <button class="btn" id="dl">⬇ Scarica immagine</button>
      <button class="btn alt" id="refresh">↻ Aggiorna dati</button>

      <label>Didascalia</label>
      <textarea class="cap" id="cap" readonly></textarea>
      <button class="btn alt" id="copy">Copia didascalia</button>

      <div class="status" id="status">Carico i dati…</div>
      <a class="back" href="./index.html">← torna al sito</a>
    </div>
  </div>

<script>
(function(){
  const COMUNI=[
    {n:"Firenzuola",lat:44.1206,lon:11.3789},{n:"Palazzuolo s.S.",lat:44.1131,lon:11.5433},
    {n:"Marradi",lat:44.0722,lon:11.6142},{n:"Barberino",lat:43.9908,lon:11.2386},
    {n:"Scarperia",lat:43.9928,lon:11.3549},{n:"San Piero",lat:43.9631,lon:11.3283},
    {n:"Borgo S.L.",lat:43.9547,lon:11.3861},{n:"Vicchio",lat:43.9339,lon:11.4650},
    {n:"Dicomano",lat:43.8917,lon:11.5222}];
  const WM={0:["☀️","sereno"],1:["🌤","poco nuvoloso"],2:["⛅","nubi sparse"],3:["☁️","coperto"],
    45:["🌫","nebbia"],48:["🌫","nebbia"],51:["🌦","pioviggine"],53:["🌦","pioviggine"],55:["🌦","pioviggine"],
    61:["🌦","pioggia debole"],63:["🌧","pioggia"],65:["🌧","pioggia forte"],71:["🌨","neve"],73:["🌨","neve"],75:["❄️","neve forte"],
    80:["🌦","rovesci"],81:["🌧","rovesci"],82:["⛈","rovesci forti"],95:["⛈","temporali"],96:["⛈","temporali"],99:["⛈","temporali"]};
  const wmo=c=>WM[c]||["⛅","variabile"];
  const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const GIORNI=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];

  // fallback di esempio (usato se i dati non si caricano, es. anteprima)
  let DATA = COMUNI.map((c,i)=>({cur:{weather_code:[2,1,3,2,2,1,2,3,2][i]},
    daily:{weather_code:[[2,3],[1,3],[3,80],[2,2],[2,2],[1,1],[2,3],[3,80],[2,80]][i],
    temperature_2m_max:[[24,22],[23,21],[24,22],[27,25],[27,25],[28,26],[27,25],[26,24],[27,25]][i],
    temperature_2m_min:[[11,12],[12,12],[13,13],[14,14],[13,13],[14,14],[13,13],[13,13],[13,13]][i]}}));
  let live=false, fmt=[1080,1350], day=0;

  const $=id=>document.getElementById(id);
  const cv=$("cv"), ctx=cv.getContext("2d");

  async function load(){
    $("status").textContent="Carico i dati…";
    try{
      const lat=COMUNI.map(c=>c.lat).join(","), lon=COMUNI.map(c=>c.lon).join(",");
      const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
        "&current=weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FRome&forecast_days=2";
      const r=await fetch(url); if(!r.ok) throw new Error(r.status);
      let d=await r.json(); if(!Array.isArray(d)) d=[d];
      DATA=d; live=true;
      $("status").textContent="Dati Open-Meteo aggiornati ✓";
    }catch(e){ live=false; $("status").textContent="Anteprima con dati di esempio (in locale i dati esterni sono bloccati)."; }
    draw();
  }

  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function draw(){
    const W=fmt[0], H=fmt[1]; cv.width=W; cv.height=H;
    const now=new Date(); now.setDate(now.getDate()+day);
    // sfondo
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0a4f3c");g.addColorStop(1,"#0f6b52");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // crinali decorativi in basso
    ctx.fillStyle="rgba(255,255,255,.06)";
    ctx.beginPath();ctx.moveTo(0,H*0.72);
    for(let x=0;x<=W;x+=W/6){ctx.lineTo(x,H*0.72-Math.sin(x/W*6)*40-40);} ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    // sole
    ctx.fillStyle="rgba(255,246,223,.9)"; ctx.beginPath();ctx.arc(W*0.82,H*0.14,60,0,7);ctx.fill();

    const pad=70;
    // header
    ctx.textBaseline="alphabetic";
    ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font="600 30px "+"'IBM Plex Mono',monospace";
    ctx.fillText(($("titolo").value||"Meteo Mugello").toUpperCase(), pad, 110);
    ctx.fillStyle="#fff"; ctx.font="800 64px 'Bricolage Grotesque',sans-serif";
    const gg=GIORNI[now.getDay()], dd=now.getDate(), mm=MESI[now.getMonth()];
    ctx.fillText(day===0?"Oggi":"Domani", pad, 190);
    ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font="500 34px 'IBM Plex Sans',sans-serif";
    ctx.fillText(gg+" "+dd+" "+mm, pad, 236);

    // sintesi: usa Borgo (idx 6) e range min/max dell'area
    let mins=[],maxs=[],codes=[];
    DATA.forEach(s=>{const dl=s.daily; maxs.push(dl.temperature_2m_max[day]); mins.push(dl.temperature_2m_min[day]); codes.push(dl.weather_code[day]);});
    const tmin=Math.round(Math.min(...mins)), tmax=Math.round(Math.max(...maxs));
    // codice prevalente
    const freq={}; codes.forEach(c=>freq[c]=(freq[c]||0)+1);
    const prev=+Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0];
    const [ico,desc]=wmo(prev);

    // riquadro sintesi
    const boxY=280;
    ctx.font="120px 'IBM Plex Sans',sans-serif"; ctx.fillStyle="#fff";
    ctx.fillText(ico, pad, boxY+120);
    ctx.font="700 40px 'Bricolage Grotesque',sans-serif"; ctx.fillStyle="#fff";
    ctx.fillText(desc.charAt(0).toUpperCase()+desc.slice(1), pad+190, boxY+70);
    ctx.font="500 34px 'IBM Plex Sans',sans-serif"; ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.fillText("min "+tmin+"°   /   max "+tmax+"°", pad+190, boxY+120);

    // griglia comuni
    const cols=(fmt[1]===1080)?3:3;
    const gridTop=boxY+200;
    const gw=(W-pad*2), cellW=gw/cols, cellH=(H-gridTop-120)/Math.ceil(COMUNI.length/cols);
    ctx.textAlign="center";
    COMUNI.forEach((c,i)=>{
      const cx=pad+cellW*(i%cols)+cellW/2;
      const cy=gridTop+cellH*Math.floor(i/cols);
      const dl=DATA[i].daily;
      const [ci]=wmo(dl.weather_code[day]);
      ctx.fillStyle="rgba(255,255,255,.10)"; roundRect(cx-cellW/2+8,cy+8,cellW-16,cellH-16,16); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="500 26px 'IBM Plex Sans',sans-serif";
      ctx.fillText(c.n, cx, cy+cellH*0.30);
      ctx.font="52px 'IBM Plex Sans',sans-serif"; ctx.fillText(ci, cx, cy+cellH*0.60);
      ctx.font="800 40px 'Bricolage Grotesque',sans-serif";
      ctx.fillText(Math.round(dl.temperature_2m_max[day])+"°", cx, cy+cellH*0.86);
    });
    ctx.textAlign="left";

    // footer
    ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font="600 26px 'IBM Plex Mono',monospace";
    ctx.fillText(($("handle").value||"Mugello Meteo & Clima"), pad, H-60);
    ctx.textAlign="right"; ctx.fillStyle="rgba(255,255,255,.6)";
    ctx.fillText(live?"dati Open-Meteo":"anteprima", W-pad, H-60); ctx.textAlign="left";

    // didascalia
    $("cap").value="🌤 Previsione Mugello — "+(day===0?"oggi":"domani")+" "+dd+" "+mm+"\n"+
      desc.charAt(0).toUpperCase()+desc.slice(1)+" sulla vallata, minime intorno ai "+tmin+"° e massime fino a "+tmax+"°.\n"+
      "Dettaglio per comune nell'immagine 👇\n\n#mugello #meteo #toscana #previsioni";
  }

  // controlli
  $("fmt").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    [...$("fmt").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");
    fmt=b.dataset.f.split("x").map(Number);draw();});
  $("day").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    [...$("day").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");
    day=+b.dataset.d;draw();});
  $("titolo").addEventListener("input",draw); $("handle").addEventListener("input",draw);
  $("refresh").addEventListener("click",load);
  $("dl").addEventListener("click",()=>{cv.toBlob(b=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="mugello-meteo-"+(day===0?"oggi":"domani")+".png";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);},"image/png");});
  $("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("cap").value);
    $("copy").textContent="Copiato ✓";setTimeout(()=>$("copy").textContent="Copia didascalia",1500);}catch(e){}});

  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(load);}else{load();}
})();
</script>
</body>
</html>
