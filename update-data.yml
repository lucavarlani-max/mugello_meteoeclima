name: Aggiorna dati fiumi

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti
  workflow_dispatch:           # esecuzione manuale dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna data/fiumi.json
        run: python scripts/fetch_fiumi.py

      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/fiumi.json; then
            git add data/fiumi.json
            git commit -m "dati fiumi: aggiornamento automatico"
            git push
          else
            echo "nessuna variazione"
          fi
