name: Carte ECMWF (link alle immagini per la pagina Mappe)

on:
  schedule:
    # la corsa delle 00 UTC si usa dalle 12 UTC e quella delle 12 UTC dalle 00 UTC (vedi scripts/fetch_ecmwf.py);
    # due esecuzioni per corsa: la seconda completa le carte mancanti se la prima è stata interrotta
    - cron: "41 0,2,12,14 * * *"
  workflow_dispatch:           # esecuzione manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: ecmwf
  cancel-in-progress: false

jobs:
  carte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli i link delle carte ECMWF
        env:
          ECMWF_BUDGET: "170"
        run: python scripts/fetch_ecmwf.py

      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ecmwf.json
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "dati: carte ECMWF"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
