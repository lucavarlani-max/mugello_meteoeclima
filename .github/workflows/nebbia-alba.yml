name: Diario della nebbia (foto all'alba e condizioni della notte)

on:
  schedule:
    # più tentativi al mattino: lo script archivia una sola volta al giorno, alla prima esecuzione
    # fra le 7 e le 10:30 ora italiana (ora legale: 7:52-10:22, ora solare: 7:52-9:22)
    - cron: "52 5,6,7,8 * * *"
  workflow_dispatch:           # esecuzione manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: nebbia-alba
  cancel-in-progress: false

jobs:
  alba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow
        run: pip install pillow

      - name: Temperature, umidità e vento della notte (CFR)
        continue-on-error: true
        run: |
          python scripts/fetch_termo.py
          python scripts/fetch_nebbia.py

      - name: Foto della webcam di Bilancino e diario
        run: python scripts/fetch_nebbia_alba.py

      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nebbia-diario.json data/nebbia.json
          if [ -d reports/nebbia ]; then git add reports/nebbia; fi
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "dati: diario della nebbia"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
