name: Classifica bioclimatica del Mugello (aggiornamento settimanale)

# Rigenera data/bioclima-anni.json (ore di disagio anno per anno per i capoluoghi del Mugello e il Passo della Futa)
# per la pagina MeteoGeek «Comfort e stress termico nel Mugello». Scarica dall'archivio delle previsioni di Open-Meteo le serie orarie
# dal 2022 a ieri (pochi minuti) e calcola Humidex, wind chill e UTCI con le formule della pagina.
on:
  schedule:
    - cron: "41 3 * * 1"          # ogni lunedì mattina (ora UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bioclima
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcola la classifica
        run: python scripts/build_bioclima.py

      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bioclima-anni.json
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -q -m "dati: classifica bioclimatica del Mugello"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 15
          done
          exit 1
