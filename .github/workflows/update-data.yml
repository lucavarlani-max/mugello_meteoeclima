name: Aggiorna dati (fiumi, invaso, allerta)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: pip install pdfplumber
      - name: Aggiorna fiumi e invaso
        run: python scripts/fetch_fiumi.py
      - name: Aggiorna allerta meteo
        run: python scripts/fetch_allerta.py
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fiumi.json data/bilancino.json data/allerta.json
          if ! git diff --cached --quiet; then
            git commit -m "dati: aggiornamento automatico"
            git push
          else
            echo "nessuna variazione"
          fi
