name: Aggiorna dati (previsioni, fiumi, invaso, allerta, temperature)

on:
  schedule:
    # ogni 30 minuti, a minuti "dispari": GitHub rimanda o salta le esecuzioni programmate
    # nei momenti di carico (soprattutto allo scoccare dell'ora), quindi si evitano :00 e :30
    - cron: "7,37 * * * *"
    # esecuzioni in più la mattina presto, quando le previsioni cambiano giorno (ora UTC)
    - cron: "3,18,48 4,5,6 * * *"
  workflow_dispatch:           # esecuzione manuale dal tab Actions

permissions:
  contents: write
  issues: write             # segnalazione del mattino per classificare la foto della nebbia

concurrency:                   # mai due aggiornamenti insieme
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install pdfplumber cryptography pillow

      - name: Aggiorna previsioni (WeatherNext / Google Weather API)
        env:
          GMAPS_WEATHER_KEY: ${{ secrets.GMAPS_WEATHER_KEY }}
        run: python fetch_previsioni.py

      - name: Rigenera le pagine meteo dei 9 comuni (previsioni nel codice per i motori di ricerca)
        continue-on-error: true
        run: python scripts/build_pagine_comuni.py

      - name: Feed RSS di Terra & Cielo (da data/notizie.json)
        continue-on-error: true
        run: python scripts/build_rss.py

      - name: Aggiorna fiumi e invaso
        run: python scripts/fetch_fiumi.py

      - name: Aggiorna allerta meteo
        run: python scripts/fetch_allerta.py

      - name: Aggiorna temperature Toscana (CFR)
        run: python scripts/fetch_termo.py

      - name: Aggiorna serie di Borgo S. Lorenzo (CFR)
        run: python scripts/fetch_bsl.py

      - name: Aggiorna idrometri Mugello (CFR)
        run: python scripts/fetch_idro.py

      - name: Aggiorna pluviometri Mugello per la verifica dei modelli (CFR, ogni 3 ore)
        continue-on-error: true
        run: python scripts/fetch_pluvio_mugello.py

      - name: Serie di Firenzuola (ARPAE Eraclito, ultimi giorni)
        continue-on-error: true
        run: python scripts/fetch_arpae_firenzuola.py

      - name: Stazione ARPAE di Firenzuola (misure giornaliere, una volta al giorno)
        continue-on-error: true
        run: python scripts/fetch_arpae_stazioni.py

      - name: Stazioni in montagna (estremi del giorno di Futa, Montegiovi e Colla)
        continue-on-error: true
        run: python scripts/fetch_montagna.py

      - name: Serie di Kremsmünster (dati mensili GeoSphere Austria, una volta al giorno)
        continue-on-error: true
        run: python scripts/fetch_kremsmuenster.py

      - name: Estremi del Mugello (record delle stazioni SIR con controllo di qualità)
        continue-on-error: true
        run: python scripts/build_hall_of_fame.py

      - name: Aggiorna umidità e vento del Mugello per la pagina della nebbia (CFR)
        continue-on-error: true
        run: python scripts/fetch_nebbia.py

      - name: Diario della nebbia (foto all'alba di Bilancino, una volta al giorno fra le 7 e le 10:30)
        continue-on-error: true
        run: python scripts/fetch_nebbia_alba.py

      - name: Aggiorna carte sinottiche (ogni 6 ore)
        run: python scripts/fetch_sinottica.py

      - name: Aggiorna ensemble ECMWF (spaghetti plot, ogni 6 ore)
        continue-on-error: true
        run: python scripts/fetch_ensemble.py

      - name: Aggiorna profili verticali per lo skew-T (ogni 6 ore)
        continue-on-error: true
        run: python scripts/fetch_skewt.py

      - name: Aggiorna estremi meteo nel mondo (OGIMET)
        run: python scripts/fetch_estremi.py

      - name: Aggiorna la stazione Netatmo (se i segreti sono configurati)
        continue-on-error: true
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          NETATMO_KEY: ${{ secrets.NETATMO_KEY }}
        run: python scripts/fetch_netatmo.py

      - name: Archivia previsioni e misure ISCARP2 (verifica del modello)
        continue-on-error: true
        run: python scripts/fetch_verifica.py

      - name: Commit se cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml meteo-*.html data/*.json data/bsl/borgo.json data/verifica/*.json data/serie/firenzuola.csv data/serie/firenzuola.json data/arpae data/serie/kremsmuenster-5012.csv data/serie/kremsmuenster.json
          if [ -f data/netatmo-token.enc ]; then git add data/netatmo-token.enc; fi
          if [ -d reports/nebbia ]; then git add reports/nebbia; fi
          if ! git diff --cached --quiet; then
            git commit -m "dati: aggiornamento automatico"
            git pull --rebase origin main || true   # se nel frattempo main è cambiato
            git push
          else
            echo "nessuna variazione"
          fi

      - name: Segnalazione per classificare la foto della nebbia
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/nebbia_issue.py apri
