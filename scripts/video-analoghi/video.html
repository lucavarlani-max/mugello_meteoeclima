<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#0a1620}canvas{display:block}</style><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Video verticale (1080x1920, 26 s) che presenta la pagina MeteoGeek «Ricerca analoghi».
   Dati veri: dati.json (scripts/video-analoghi/prepara.py) e la base cartografica data/sinottica-mappa.json.
   render.js chiama window.frame(t) per ogni fotogramma. */
const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d');
let D=null,M=null,land=null;const DUR=26;
const MESL=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const VENTI=['nord','nord-est','est','sud-est','sud','sud-ovest','ovest','nord-ovest'];
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const L=70,R=1010;
const mig=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const n1=x=>x.toFixed(1).replace('.',',').replace(/^-/,'−');
const lunga=s=>{const [y,m,d]=s.split('-').map(Number);return d+' '+MESL[m-1]+' '+y};
function txt(s,x,y,sz,col,al='left',w=600,a=1){if(a<=0)return;g.globalAlpha=a;g.fillStyle=col;g.font=w+' '+sz+'px Inter, DejaVu Sans, sans-serif';g.textAlign=al;g.textBaseline='alphabetic';g.fillText(s,x,y);g.globalAlpha=1}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

// --- carta della pressione: stessa proiezione e stessa interpolazione della pagina ---
function pos(lat,lon){const NI=M.lats.length,NJ=M.lons.length,fi=(lat-M.lats[0])/(M.lats[1]-M.lats[0]),fj=(lon-M.lons[0])/(M.lons[1]-M.lons[0]);
  const i=Math.max(0,Math.min(NI-2,Math.floor(fi))),j=Math.max(0,Math.min(NJ-2,Math.floor(fj))),a=fi-i,b=fj-j,xy=M.xy;
  const p00=xy[i*NJ+j],p01=xy[i*NJ+j+1],p10=xy[(i+1)*NJ+j],p11=xy[(i+1)*NJ+j+1];
  return [(1-a)*((1-b)*p00[0]+b*p01[0])+a*((1-b)*p10[0]+b*p11[0]),(1-a)*((1-b)*p00[1]+b*p01[1])+a*((1-b)*p10[1]+b*p11[1])]}
const LA=[52,44,36],LO=[-5,5,15,25];
const cr=(p0,p1,p2,p3,t)=>.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);
function campo(P,fr,fc){const r=Math.max(0,Math.min(1,Math.floor(fr))),k=Math.max(0,Math.min(2,Math.floor(fc))),tr=fr-r,tc=fc-k,riga=[];
  for(let q=-1;q<=2;q++){const rr2=Math.max(0,Math.min(2,r+q)),v=z=>P[rr2*4+Math.max(0,Math.min(3,z))];riga.push(cr(v(k-1),v(k),v(k+1),v(k+2),tc))}
  return cr(riga[0],riga[1],riga[2],riga[3],tr)}
function tinta(p){const t=Math.max(-1,Math.min(1,(p-1015)/22)),a=Math.pow(Math.abs(t),.8),A0=[30,44,58],B=t<0?[52,120,205]:[226,104,52];
  return 'rgb('+A0.map((x,k)=>Math.round(x+(B[k]-x)*a)).join(',')+')'}
let BOX=null;
function riquadro(){const x0=Math.max(pos(55,-9)[0],pos(33,-9)[0]),x1=Math.min(pos(55,29)[0],pos(33,29)[0]);let y1=1e9;
  for(let k=0;k<=20;k++)y1=Math.min(y1,pos(33,-9+38*k/20)[1]);
  const y0=Math.max(pos(55,-9)[1],pos(55,29)[1],pos(55,10)[1]);BOX={x0,x1,y0,y1,asp:(y1-y0)/(x1-x0)}}
function carta(P,x,y,w,o){ // o: {a: opacità, wipe: 0..1 comparsa da sinistra, mini, vento, et}
  o=o||{};const a=o.a==null?1:o.a;if(a<=0)return;const h=w*BOX.asp,s=w/(BOX.x1-BOX.x0),u=1/s;
  g.save();g.globalAlpha=a;rr(x,y,w,h,o.mini?18:26);g.clip();
  g.fillStyle='#0f2231';g.fillRect(x,y,w,h);
  g.translate(x-BOX.x0*s,y-BOX.y0*s);g.scale(s,s);
  g.fillStyle='#1b3345';g.fill(land);
  const wipe=o.wipe==null?1:o.wipe;
  if(wipe>0){
    g.save();g.beginPath();g.rect(BOX.x0,BOX.y0,(BOX.x1-BOX.x0)*wipe,BOX.y1-BOX.y0);g.clip();
    const NR=20,NC=36,F=[];for(let i=0;i<=NR;i++){F.push([]);for(let j=0;j<=NC;j++)F[i].push(campo(P,i/NR*2,j/NC*3))}
    const ll=(i,j)=>pos(52-16*i/NR,-5+30*j/NC);
    g.globalAlpha=a*.82;
    for(let i=0;i<NR;i++)for(let j=0;j<NC;j++){g.fillStyle=tinta((F[i][j]+F[i+1][j]+F[i][j+1]+F[i+1][j+1])/4);
      const p1=ll(i,j),p2=ll(i,j+1),p3=ll(i+1,j+1),p4=ll(i+1,j);g.beginPath();g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);g.lineTo(p3[0],p3[1]);g.lineTo(p4[0],p4[1]);g.closePath();g.fill();g.strokeStyle=g.fillStyle;g.lineWidth=.6;g.stroke()}
    g.globalAlpha=a;g.strokeStyle='rgba(232,240,246,.7)';g.lineWidth=(o.mini?1.6:1.3)*u;g.stroke(land);
    let mn=1e9,mx=-1e9;F.forEach(r=>r.forEach(v=>{mn=Math.min(mn,v);mx=Math.max(mx,v)}));
    g.strokeStyle='#ffffff';g.lineWidth=(o.mini?2.2:2.4)*u;
    for(let Lv=Math.ceil(mn/4)*4;Lv<=mx;Lv+=4){const sg=[];
      for(let i=0;i<NR;i++)for(let j=0;j<NC;j++){const A1=F[i][j],B1=F[i][j+1],C1=F[i+1][j+1],D1=F[i+1][j];
        const code=(A1>=Lv?8:0)|(B1>=Lv?4:0)|(C1>=Lv?2:0)|(D1>=Lv?1:0);if(code===0||code===15)continue;
        const t=(p,q)=>(Lv-p)/(q-p),top=[i,j+t(A1,B1)],right=[i+t(B1,C1),j+1],bottom=[i+1,j+t(D1,C1)],left=[i+t(A1,D1),j];
        ({1:[[left,bottom]],2:[[bottom,right]],3:[[left,right]],4:[[top,right]],5:[[left,top],[bottom,right]],6:[[top,bottom]],7:[[left,top]],8:[[left,top]],9:[[top,bottom]],10:[[left,bottom],[top,right]],11:[[top,right]],12:[[left,right]],13:[[bottom,right]],14:[[left,bottom]]}[code]).forEach(z=>sg.push(z))}
      if(!sg.length)continue;g.globalAlpha=a*.85;g.beginPath();sg.forEach(([p,q])=>{const a1=ll(p[0],p[1]),b1=ll(q[0],q[1]);g.moveTo(a1[0],a1[1]);g.lineTo(b1[0],b1[1])});g.stroke();g.globalAlpha=a;
      if(!o.mini){const md=sg[Math.floor(sg.length*.38)],cc=ll((md[0][0]+md[1][0])/2,(md[0][1]+md[1][1])/2);
        cc[0]=Math.max(BOX.x0+34*u,Math.min(BOX.x1-34*u,cc[0]));cc[1]=Math.max(BOX.y0+20*u,Math.min(BOX.y1-20*u,cc[1]));
        g.font='700 '+22*u+'px DejaVu Sans Mono, monospace';g.textAlign='center';g.textBaseline='middle';g.lineWidth=7*u;g.strokeStyle='#0f2231';g.strokeText(String(Lv),cc[0],cc[1]);g.fillStyle='#fff';g.fillText(String(Lv),cc[0],cc[1]);g.strokeStyle='#fff';g.lineWidth=2.4*u}}
    let jmin=0,jmax=0;P.forEach((v,j)=>{if(v<P[jmin])jmin=j;if(v>P[jmax])jmax=j});
    const lettera=(j,t,col)=>{const p=pos(LA[Math.floor(j/4)],LO[j%4]),m=(o.mini?34:44)*u,xx=Math.max(BOX.x0+m,Math.min(BOX.x1-m,p[0])),yy=Math.max(BOX.y0+m*1.1,Math.min(BOX.y1-m*1.1,p[1]));
      g.textAlign='center';g.textBaseline='middle';g.font='800 '+(o.mini?40:54)*u+'px Inter, DejaVu Sans, sans-serif';g.lineWidth=9*u;g.strokeStyle='#0f2231';g.strokeText(t,xx,yy-12*u);g.fillStyle=col;g.fillText(t,xx,yy-12*u);
      g.font='700 '+(o.mini?19:22)*u+'px DejaVu Sans Mono, monospace';g.lineWidth=6*u;g.strokeText(Math.round(P[j]),xx,yy+(o.mini?20:26)*u);g.fillStyle='#fff';g.fillText(Math.round(P[j]),xx,yy+(o.mini?20:26)*u)};
    if(P[jmax]-P[jmin]>=3){lettera(jmax,'A','#ff6b5a');lettera(jmin,'B','#7fb8ff')}
    g.restore();
  }
  const [bx,by]=M.mugello;
  if(o.vento&&o.vento.s>1&&wipe>=1){const len=Math.min(150,40+o.vento.s*6)*u,ang=(o.vento.d+180)*Math.PI/180,ex=bx+Math.sin(ang)*len,ey=by-Math.cos(ang)*len,hd=18*u;
    g.strokeStyle='#0f2231';g.lineWidth=11*u;g.lineCap='round';g.beginPath();g.moveTo(bx,by);g.lineTo(ex,ey);g.stroke();
    g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=5*u;g.beginPath();g.moveTo(bx,by);g.lineTo(ex,ey);g.stroke();
    g.beginPath();g.moveTo(ex,ey);g.lineTo(ex-Math.sin(ang-.45)*hd,ey+Math.cos(ang-.45)*hd);g.lineTo(ex-Math.sin(ang+.45)*hd,ey+Math.cos(ang+.45)*hd);g.closePath();g.fill()}
  g.beginPath();g.arc(bx,by,(o.mini?8:10)*u,0,7);g.fillStyle='#3ddc97';g.fill();g.lineWidth=4*u;g.strokeStyle='#0f2231';g.stroke();
  g.restore();
  g.globalAlpha=a;g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=2;rr(x,y,w,h,o.mini?18:26);g.stroke();g.globalAlpha=1;
  return h}

function chip(s,x,y,a,col='#6fd0a8'){if(a<=0)return;g.font='700 24px DejaVu Sans Mono, monospace';const w=g.measureText(s).width+36;g.globalAlpha=a;g.fillStyle='rgba(8,18,28,.9)';rr(x,y,w,46,23);g.fill();g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;g.stroke();g.globalAlpha=1;txt(s,x+18,y+32,24,col,'left',700,a);g.font='700 24px DejaVu Sans Mono, monospace';return w}
function casella(lab,val,x,y,w,a){if(a<=0)return;g.globalAlpha=a;g.fillStyle='rgba(255,255,255,.06)';rr(x,y,w,128,20);g.fill();g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=2;g.stroke();g.globalAlpha=1;
  txt(lab.toUpperCase(),x+22,y+42,22,'#8aa0b4','left',700,a);txt(val,x+22,y+100,46,'#fff','left',800,a)}

  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1c2b');bg.addColorStop(1,'#07101a');g.fillStyle=bg;g.fillRect(0,0,W,H);

    // mini carta di riferimento in alto a destra
    const top=540,bot=1380,X=y=>L+60+(y-y0)/(y1+1-y0)*(R-L-60),Y=s=>bot-(s/100)*(bot-top);

    for(let s=0;s<=100;s+=20){g.strokeStyle='rgba(255,255,255,.10)';g.lineWidth=1.5;g.beginPath();g.moveTo(L+60,Y(s));g.lineTo(R,Y(s));g.stroke()}
    g.globalAlpha=1;

    for(let y=1960;y<=2020;y+=10)txt(String(y),X(y),bot+44,24,'#8aa0b4','center',500,a3);
    txt('somiglianza con il '+lunga(rif.data)+' (0-100)',L+60,top-26,26,'#8aa0b4','left',500,a3);

      const forte=sc>=soglia;g.globalAlpha=a3*(forte?1:.5)*e;g.fillStyle=forte?'#3ddc97':sc>=70?'#ffd23f':'#5d87b3';g.beginPath();g.arc(X(yf),Y(sc),(forte?9:4.2)*(eta<.35?1+1.2*(1-e):1),0,7);g.fill()}
    g.globalAlpha=1;

      txt('I punti verdi sono i più simili',L+34,1685,46,'#3ddc97','left',800,af);txt('pressione, vento, temperatura e pioggia quasi uguali',L+34,1736,28,'#d6e0ea','left',500,af)}
  }

      txt(String(sc),tx,y+322,124,'#3ddc97','left',800,a);g.font='800 124px Inter, DejaVu Sans, sans-serif';const wsc=g.measureText(String(sc)).width;
      txt('/100',tx+wsc+12,y+322,44,'#8aa0b4','left',700,a);

  }
