<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#0b1118}canvas{display:block}</style><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* «La pioggia sul Mugello»: la cumulata dell'evento cresce in 3D, giorno per giorno.
   Canvas 2D puro: la griglia interpolata di dati.json è estrusa in altezza, illuminata da una
   luce direzionale e disegnata con l'algoritmo del pittore. Le celle della superficie e le pareti
   del perimetro stanno nella stessa lista ordinata per profondità, così non si coprono a vicenda. */
const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d');
let D=null;const DUR=26,FONT='Inter, DejaVu Sans, sans-serif';
const MESL=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a)),mix=(a,b,t)=>a+(b-a)*t;
const txt=(s,x,y,sz,c,al='left',w=700,a=1)=>{if(a<=0)return;g.globalAlpha=a;g.fillStyle=c;g.font=w+' '+sz+'px '+FONT;g.textAlign=al;g.fillText(s,x,y);g.globalAlpha=1};

/* ---------- scala di colore (mm) ---------- */
const SCALA=[[0,'#0d2137'],[40,'#14527d'],[80,'#1b87a6'],[120,'#2ab79a'],[160,'#8ccb55'],[200,'#f0c22e'],[230,'#ee7a28'],[260,'#d2362a']],MAXC=260;
const P16=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function col(v){
  let i=0;while(i<SCALA.length-2&&v>SCALA[i+1][0])i++;
  const A=P16(SCALA[i][1]),B=P16(SCALA[i+1][1]),t=cl((v-SCALA[i][0])/(SCALA[i+1][0]-SCALA[i][0]));
  return[mix(A[0],B[0],t),mix(A[1],B[1],t),mix(A[2],B[2],t)];
}
const rgb=(r,v,b,k=1)=>'rgb('+cl(r*k,0,255)+','+cl(v*k,0,255)+','+cl(b*k,0,255)+')';

/* ---------- proiezione ---------- */
const CX=540,CYB=930,SCX=1012,SCY=800,TILT=.56,KZ=1.6;
let YAW=0,CY=CYB;   // la base scende man mano che il rilievo cresce, così resta in quadro
function proj(u,w,z){                      // u,w in 0..1 (ovest→est, sud→nord); z in mm
  const x=(u-.5)*SCX,y=(w-.5)*SCY,s=Math.sin(YAW),co=Math.cos(YAW);
  const rx=x*co-y*s,ry=x*s+y*co;
  return[CX+rx,CY-ry*TILT-z*KZ,ry];
}

/* ---------- superficie ---------- */
function valore(k,t){                      // cumulata del nodo k al tempo t (giorni frazionari)
  const C=D.griglia.c[k],n=C.length,i=Math.floor(t);
  if(t<=0)return 0;
  if(i<=0)return C[0]*t;
  if(i>=n)return C[n-1];
  return mix(C[i-1],C[i],t-i);
}
function rilievo(t){
  const G=D.griglia,nx=G.nx,ny=G.ny,V=new Float64Array(nx*ny);
  for(let k=0;k<nx*ny;k++)V[k]=valore(k,t);
  const q=[];                              // quadrilateri: [profondità, p1..p4, colore]
  const LX=-.42,LY=.3,LZ=.86;              // luce da sud-ovest, dall'alto
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const k=j*nx+i,v00=V[k],v10=V[k+1],v01=V[k+nx],v11=V[k+nx+1];
    const u0=i/(nx-1),u1=(i+1)/(nx-1),w0=j/(ny-1),w1=(j+1)/(ny-1);
    const a=proj(u0,w0,v00),b=proj(u1,w0,v10),d=proj(u1,w1,v11),e=proj(u0,w1,v01);
    const dx=v10-v00,dy=v01-v00,nx2=-dx*.05,ny2=-dy*.05,nl=Math.hypot(nx2,ny2,1);
    const lum=cl((nx2*LX+ny2*LY+LZ)/nl,0,1),C=col((v00+v10+v11+v01)/4);
    q.push([(a[2]+b[2]+d[2]+e[2])/4,a,b,d,e,rgb(C[0],C[1],C[2],.45+.75*lum)]);
  }
  const giro=[];                           // perimetro, in senso orario
  for(let i=0;i<nx-1;i++)giro.push([i,0,i+1,0]);
  for(let j=0;j<ny-1;j++)giro.push([nx-1,j,nx-1,j+1]);
  for(let i=nx-1;i>0;i--)giro.push([i,ny-1,i-1,ny-1]);
  for(let j=ny-1;j>0;j--)giro.push([0,j,0,j-1]);
  for(const [i1,j1,i2,j2] of giro){
    const u1=i1/(nx-1),w1=j1/(ny-1),u2=i2/(nx-1),w2=j2/(ny-1);
    const a=proj(u1,w1,V[j1*nx+i1]),b=proj(u2,w2,V[j2*nx+i2]),b0=proj(u2,w2,0),a0=proj(u1,w1,0);
    q.push([(a[2]+b[2])/2,a,b,b0,a0,'#0a1420']);
  }
  q.sort((a,b)=>b[0]-a[0]);
  g.lineWidth=1;g.lineJoin='round';
  for(const [,a,b,d,e,f] of q){
    g.fillStyle=f;g.strokeStyle=f;
    g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(d[0],d[1]);g.lineTo(e[0],e[1]);g.closePath();g.fill();g.stroke();
  }
  return V;
}

/* ---------- stazioni ---------- */
const tot=s=>s.v.reduce((a,b)=>a+b,0);
function cum(s,t){const n=s.v.length,i=Math.floor(t);let a=0;
  if(t<=0)return 0;
  for(let k=0;k<Math.min(i,n);k++)a+=s.v[k];
  if(i<n)a+=s.v[i]*cl(t-i);
  return a;}
function posiz(s){const G=D.griglia;return[(s.lo-G.lo0)/(G.lo1-G.lo0),(s.la-G.la0)/(G.la1-G.la0)];}
function spilli(t){
  const L=D.stazioni.map(s=>({s,c:cum(s,t)})).sort((a,b)=>b.c-a.c),o=L[0];
  if(o.c<1)return;
  const [u,w]=posiz(o.s),p=proj(u,w,o.c);
  g.fillStyle='#ff4d4d';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2.5;
  g.beginPath();g.arc(p[0],p[1],9,0,7);g.fill();g.stroke();
  const et=o.s.n+'   '+Math.round(o.c)+' mm';
  g.font='700 31px '+FONT;const lw=g.measureText(et).width;
  const x=cl(p[0]-lw/2,36,W-lw-36),y=Math.max(486,p[1]-40);
  g.fillStyle='rgba(9,17,27,.82)';g.beginPath();g.roundRect(x-16,y-34,lw+32,46,11);g.fill();
  txt(et,x,y,31,'#ffffff','left',700);
}

/* ---------- parti fisse ---------- */
function testa(a){
  txt('MUGELLO METEO & CLIMA',540,112,25,'rgba(255,255,255,.5)','center',600,a);
  txt('LA PIOGGIA',540,226,86,'#ffffff','center',800,a);
  txt('SUL MUGELLO',540,314,86,'#ffffff','center',800,a);
  const d0=D.giorni[0],d1=D.giorni[D.giorni.length-1];
  txt(+d0.slice(8,10)+'–'+ +d1.slice(8,10)+' '+MESL[+d1.slice(5,7)-1].toUpperCase()+' '+d1.slice(0,4),540,382,37,'#7fd4e8','center',700,a);
}
function legenda(a){
  const x0=150,x1=930,y=1566;
  txt('PIOGGIA CUMULATA (mm)',540,y-26,27,'rgba(255,255,255,.72)','center',700,a);
  const gr=g.createLinearGradient(x0,0,x1,0);
  for(let i=0;i<=12;i++){const C=col(i/12*MAXC);gr.addColorStop(i/12,rgb(C[0],C[1],C[2]));}
  g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.roundRect(x0,y,x1-x0,24,12);g.fill();g.globalAlpha=1;
  for(let v=0;v<=MAXC;v+=50)txt(v,x0+(x1-x0)*v/MAXC,y+54,23,'rgba(255,255,255,.72)','center',600,a);
}
function pieApie(a){
  txt('Dati: pluviometri SIR Toscana e ARPAE · interpolazione IDW corretta per la quota',540,1768,22,'rgba(255,255,255,.45)','center',500,a);
  txt('mugello-meteo · elaborazione L. Varlani',540,1804,22,'rgba(255,255,255,.45)','center',500,a);
}
function contatore(t,ng,a){                 // giorno in corso e barra di avanzamento
  if(a<=0)return;
  const i=cl(Math.floor(t),0,ng-1),d=D.giorni[i];
  txt(+d.slice(8,10)+' '+MESL[+d.slice(5,7)-1],540,1396,46,'#ffffff','center',700,a);
  const x0=250,x1=830,y=1428;
  g.globalAlpha=a;g.fillStyle='rgba(255,255,255,.16)';g.beginPath();g.roundRect(x0,y,x1-x0,6,3);g.fill();
  g.fillStyle='#7fd4e8';g.beginPath();g.roundRect(x0,y,(x1-x0)*cl(t/ng),6,3);g.fill();g.globalAlpha=1;
}
function confronto(a){                      // le due cifre che raccontano l'evento
  if(a<=0)return;
  const L=D.stazioni.filter(s=>!/\s\d+$/.test(s.n)).sort((x,y)=>tot(y)-tot(x)),A=L[0],B=L[L.length-1];
  txt('IL CRINALE HA PRESO IL DOPPIO DEL FONDOVALLE',540,1374,30,'#7fd4e8','center',700,a);
  txt(A.n+'  ·  '+A.q+' m',150,1452,33,'rgba(255,255,255,.8)','left',600,a);
  txt(Math.round(tot(A))+' mm',930,1452,44,'#ee7a28','right',800,a);
  txt(B.n+'  ·  '+B.q+' m',150,1522,33,'rgba(255,255,255,.8)','left',600,a);
  txt(Math.round(tot(B))+' mm',930,1522,44,'#2ab79a','right',800,a);
}

/* ---------- fotogramma ---------- */
function draw(t){
  g.fillStyle='#0b1118';g.fillRect(0,0,W,H);
  if(!D)return;
  const ng=D.giorni.length,T0=1.7,T1=18.2;
  const gi=seg(t,T0,T1)*ng;
  YAW=-0.32+0.17*eio(seg(t,T0,DUR));
  CY=CYB+Math.max(...D.stazioni.map(s=>cum(s,gi)))*KZ*.45;
  rilievo(gi);
  spilli(gi);
  testa(ease(seg(t,.2,1.4)));
  const fin=ease(seg(t,T1+.5,T1+1.5));
  contatore(gi,ng,ease(seg(t,T0,T0+.6))*(1-fin));
  legenda(ease(seg(t,1.2,2.2))*(1-fin));
  confronto(fin);
  pieApie(ease(seg(t,1.2,2.2)));
}
fetch('dati.json').then(r=>r.json()).then(d=>{D=d;window.pronto=true;draw(0)});
window.frame=t=>draw(t);
</script>
