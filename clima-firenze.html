function avg(arr) {
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

function sum(arr) {
  return arr.reduce((a, b) => a + b, 0);
}

function linearRegression(xs, ys) {
  const n = xs.length;
  const mx = avg(xs), my = avg(ys);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - mx) * (ys[i] - my);
    den += (xs[i] - mx) ** 2;
  }
  const slope = den === 0 ? 0 : num / den;
  const intercept = my - slope * mx;
  const predict = (x) => slope * x + intercept;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    ssRes += (ys[i] - predict(xs[i])) ** 2;
    ssTot += (ys[i] - my) ** 2;
  }
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  const residualStd = Math.sqrt(ssRes / Math.max(1, n - 2));
  return { slope, intercept, predict, r2, residualStd };
}

function fmt1(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toFixed(1).replace(".", ",");
}

function fmt0(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return Math.round(n).toString();

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function svgNodeToPng(svgEl, scale, bgColor) {
  return new Promise((resolve, reject) => {
    try {
      const serializer = new XMLSerializer();
      const clone = svgEl.cloneNode(true);
      const bbox = svgEl.getBoundingClientRect();
      const width = bbox.width || 800;
      const height = bbox.height || 400;
      clone.setAttribute("width", width);
      clone.setAttribute("height", height);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      const svgString = serializer.serializeToString(clone);
      const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bgColor || "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => resolve(blob), "image/png");
      };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    } catch (e) {
      reject(e);
    }
  });
}

.panel-sub { font-size: 13px; color: #8A7960; margin: 0; }

.kpi-stack { background: #FFFDF8; display: flex; flex-direction: column; }
.kpi-row { padding: 18px 28px; border-bottom: 1px solid #EFE6D3; }
.kpi-row:last-child { border-bottom: none; }
.kpi-label { font-size: 12px; color: #8A7960; margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
.kpi-values { display: flex; gap: 20px; align-items: baseline; }
.kpi-val { display: flex; flex-direction: column; }
.kpi-val span:last-child {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 26px;
  font-weight: 600;
}
.kpi-val-a span:last-child { color: #B5502E; }
.kpi-val-b span:last-child { color: #C99A3B; }
.kpi-year { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #A99A82; }
.kpi-note { font-size: 11px; color: #A99A82; margin-top: 6px; }

.trend-panel, .extremes-panel { border-top: 1px solid #E4D9C3; }
.proj-controls { display: flex; align-items: center; gap: 6px; }
.footnote { font-size: 12px; color: #8A7960; margin-top: 10px; max-width: 70ch; line-height: 1.5; }

.extremes-list { margin: 0; }
.ext-row {
  display: flex; justify-content: space-between; gap: 16px;
  padding: 10px 0; border-bottom: 1px dashed #E4D9C3; font-size: 14px;
}
.ext-row:last-child { border-bottom: none; }
.ext-row dt { color: #5B4B39; margin: 0; }
.ext-row dd { margin: 0; font-family: 'IBM Plex Mono', monospace; color: #241B12; }

.foot {
  padding: 20px 40px 32px 40px;
  font-size: 11px;
  color: #A99A82;
  line-height: 1.6;
  background: #F4EEE0;
}

.tt {
  background: #241B12;
  color: #F4EEE0;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12px;
  min-width: 200px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.tt-head { font-family: 'Fraunces', Georgia, serif; font-size: 14px; margin-bottom: 8px; }
.tt-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; flex-wrap: wrap; }
.tt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tt-label { flex: 1; color: #D8CBB4; }
.tt-value { font-family: 'IBM Plex Mono', monospace; }
.tt-sub { width: 100%; padding-left: 14px; font-size: 10px; color: #A99A82; }
.tt-sep { height: 1px; background: #4A3F2E; margin: 6px 0; }

@media (max-width: 640px) {
  .hero { flex-direction: column; align-items: flex-start; padding: 32px 20px; }
  .hero h1 { font-size: 30px; }
  .controls { padding: 16px 20px; }
  .panel { padding: 20px; }
  .export-group { margin-left: 0; }
  .foot { padding: 16px 20px 24px 20px; }
}
`;

function ClimaDashboard() {
  const [seasonKey, setSeasonKey] = useState("Anno intero");
  const [yearA, setYearA] = useState(2020);
  const [yearB, setYearB] = useState(1991);
  const [cityKey, setCityKey] = useState("");
  const [projYears, setProjYears] = useState(10);
  const [exportMsg, setExportMsg] = useState("");
  const climoRef = useRef(null);
  const trendRef = useRef(null);

  const seasonMonths = SEASONS[seasonKey];
  const D = FI_DATA;
  const climaMedia = D.clima_media;

  const climoData = useMemo(() => {
    return MONTHS.map((m, i) => ({
      i, month: m, monthFull: MONTHS_FULL[i],
      tmedA: D.tmed_annual[yearA][i],
      tmedB: D.tmed_annual[yearB][i],
      tmedNorm: climaMedia.Tmed_media[i],
      pioggiaA: D.pioggia_annual[yearA][i],
      pioggiaB: D.pioggia_annual[yearB][i],
      pioggiaNorm: climaMedia.Pioggia_media[i],
      tmedCity: cityKey ? CITY_NORMALS[cityKey].Tmed[i] : null,
      pioggiaCity: cityKey ? CITY_NORMALS[cityKey].Pioggia[i] : null,
      inSeason: seasonMonths.includes(i),
    }));
  }, [yearA, yearB, cityKey, seasonKey]);

  const kpi = useMemo(() => {
    const pick = (arr) => seasonMonths.map((i) => arr[i]);
    const avgOf = (arr) => pick(arr).reduce((a, b) => a + b, 0) / seasonMonths.length;
    const sumOf = (arr) => pick(arr).reduce((a, b) => a + b, 0);
    return {
      tmedA: avgOf(D.tmed_annual[yearA]),
      tmedB: avgOf(D.tmed_annual[yearB]),
      tmedNorm: avgOf(climaMedia.Tmed_media),
      tmedCity: cityKey ? avgOf(CITY_NORMALS[cityKey].Tmed) : null,
      pioggiaA: sumOf(D.pioggia_annual[yearA]),
      pioggiaB: sumOf(D.pioggia_annual[yearB]),
      pioggiaNorm: sumOf(climaMedia.Pioggia_media),
      pioggiaCity: cityKey ? sumOf(CITY_NORMALS[cityKey].Pioggia) : null,
      giorniA: sumOf(D.giorni_pioggia_annual[yearA]),
      giorniB: sumOf(D.giorni_pioggia_annual[yearB]),
      giorniNorm: sumOf(climaMedia.Giorni_pioggia_media),
    };
  }, [yearA, yearB, cityKey, seasonKey]);

  const trend = useMemo(() => {
    const annualMeans = YEARS.map((y) => avg(D.tmed_annual[y]));
    const reg = linearRegression(YEARS, annualMeans);
    const historical = YEARS.map((y, idx) => ({
      year: y, actual: annualMeans[idx], fit: reg.predict(y),
    }));
    const lastYear = YEARS[YEARS.length - 1];
    const projection = Array.from({ length: projYears }, (_, k) => {
      const y = lastYear + k + 1;
      return { year: y, projected: reg.predict(y) };
    });
    return { annualMeans, reg, historical, projection, lastYear };
  }, [projYears]);

  const trendData = useMemo(() => {
    const rows = trend.historical.map((r) => ({ year: r.year, actual: r.actual, fit: r.fit }));
    const lastFit = trend.reg.predict(trend.lastYear);
    const bridge = { year: trend.lastYear, projected: lastFit };
    const projRows = trend.projection.map((r) => ({ year: r.year, projected: r.projected }));
    return [...rows, bridge, ...projRows];
  }, [trend]);

  const extremes = useMemo(() => {
    const annualTmed = YEARS.map((y) => ({ year: y, v: avg(D.tmed_annual[y]) }));
    const annualPioggia = YEARS.map((y) => ({ year: y, v: sum(D.pioggia_annual[y]) }));
    const hottest = annualTmed.reduce((a, b) => (b.v > a.v ? b : a));
    const coldest = annualTmed.reduce((a, b) => (b.v < a.v ? b : a));
    const wettest = annualPioggia.reduce((a, b) => (b.v > a.v ? b : a));
    const driest = annualPioggia.reduce((a, b) => (b.v < a.v ? b : a));
    return { hottest, coldest, wettest, driest };
  }, []);

  const wavesA = D.ondate_calore[String(yearA)] ? D.ondate_calore[String(yearA)][4] : 0;
  const wavesAcold = D.ondate_freddo[String(yearA)] ? D.ondate_freddo[String(yearA)][4] : 0;
  const wavesB = D.ondate_calore[String(yearB)] ? D.ondate_calore[String(yearB)][4] : 0;
  const wavesBcold = D.ondate_freddo[String(yearB)] ? D.ondate_freddo[String(yearB)][4] : 0;

  function handleExportCSV() {
    const header = ["Mese", "Tmed " + yearA, "Tmed " + yearB, "Tmed normale 1991-2020"];
    if (cityKey) header.push("Tmed " + cityKey);
    header.push("Pioggia " + yearA + " (mm)", "Pioggia " + yearB + " (mm)", "Pioggia normale (mm)");
    if (cityKey) header.push("Pioggia " + cityKey + " (mm)");
    const lines = [header.join(";")];
    climoData.forEach((row) => {
      const cells = [row.monthFull, fmt1(row.tmedA), fmt1(row.tmedB), fmt1(row.tmedNorm)];
      if (cityKey) cells.push(fmt1(row.tmedCity));
      cells.push(fmt0(row.pioggiaA), fmt0(row.pioggiaB), fmt0(row.pioggiaNorm));
      if (cityKey) cells.push(fmt0(row.pioggiaCity));
      lines.push(cells.join(";"));
    });
    lines.push("");
    lines.push("Riepilogo periodo selezionato: " + seasonKey);
    lines.push(["Serie", "T media (°C)", "Pioggia totale (mm)", "Giorni di pioggia"].join(";"));
    lines.push([yearA, fmt1(kpi.tmedA), fmt0(kpi.pioggiaA), fmt0(kpi.giorniA)].join(";"));
    lines.push([yearB, fmt1(kpi.tmedB), fmt0(kpi.pioggiaB), fmt0(kpi.giorniB)].join(";"));
    lines.push(["Normale 1991-2020", fmt1(kpi.tmedNorm), fmt0(kpi.pioggiaNorm), fmt0(kpi.giorniNorm)].join(";"));
    if (cityKey) lines.push([cityKey + " (normale)", fmt1(kpi.tmedCity), fmt0(kpi.pioggiaCity), ""].join(";"));
    downloadBlob(
      "firenze-clima_" + yearA + "-vs-" + yearB + ".csv",
      "﻿" + lines.join("\n"),
      "text/csv;charset=utf-8"
    );
  }

  async function handleExportPNG(ref, name) {
    const container = ref.current;
    if (!container) return;
    const svg = container.querySelector("svg");
    if (!svg) return;
    setExportMsg("Esportazione in corso...");
    try {
      const blob = await svgNodeToPng(svg, 2, "#F4EEE0");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setExportMsg("Immagine esportata.");
    } catch (e) {
      setExportMsg("Esportazione non riuscita in questo browser.");
    }
    setTimeout(() => setExportMsg(""), 3000);
  }

  function ClimoTooltip({ active, payload, label }) {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    return (
      <div className="tt">
        <div className="tt-head">{row.monthFull}</div>
        <TTRow color="#B5502E" label={"Temp. media " + yearA} value={fmt1(row.tmedA) + " °C"} sub={devLabel(row.tmedA, row.tmedNorm)} />
        <TTRow color="#C99A3B" label={"Temp. media " + yearB} value={fmt1(row.tmedB) + " °C"} sub={devLabel(row.tmedB, row.tmedNorm)} />
        <TTRow color="#8A7960" label="Normale 1991-2020" value={fmt1(row.tmedNorm) + " °C"} />
        {cityKey && <TTRow color="#4A5A78" label={"Temp. " + cityKey} value={fmt1(row.tmedCity) + " °C"} />}
        <div className="tt-sep" />
        <TTRow color="#7C8A5C" label={"Pioggia " + yearA} value={fmt0(row.pioggiaA) + " mm"} />
        <TTRow color="#B7C08E" label={"Pioggia " + yearB} value={fmt0(row.pioggiaB) + " mm"} />
        {cityKey && <TTRow color="#9AA7C7" label={"Pioggia " + cityKey} value={fmt0(row.pioggiaCity) + " mm"} />}
      </div>
    );
  }

  function TrendTooltip({ active, payload, label }) {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    const isProjected = row.actual === undefined;
    return (
      <div className="tt">
        <div className="tt-head">{row.year}{isProjected ? " · proiezione" : ""}</div>
        {row.actual !== undefined && <TTRow color="#B5502E" label="T media annua" value={fmt1(row.actual) + " °C"} />}
        {row.fit !== undefined && <TTRow color="#8A7960" label="Retta di tendenza" value={fmt1(row.fit) + " °C"} />}
        {row.projected !== undefined && <TTRow color="#4A5A78" label="Valore proiettato" value={fmt1(row.projected) + " °C"} />}
      </div>
    );
  }

  return (
    <div className="wrap">
      <style>{CSS}</style>

      <header className="hero">
        <div className="hero-text">
          <p className="eyebrow">Serie storica 1991&ndash;2020 &middot; stazione di Firenze</p>
          <h1>Firenze, il clima<br />in trent&rsquo;anni di numeri</h1>
          <p className="lede">
            Confronta due anni, isola una stagione, proietta il trend di riscaldamento
            e misura Firenze rispetto ad altre citt&agrave; italiane.
          </p>
        </div>
        <AnomalySpiral years={YEARS} values={trend.annualMeans} />
      </header>

      <section className="controls">
        <div className="control-group">
          <span className="control-label">Periodo</span>
          <div className="chips">
            {Object.keys(SEASONS).map((s) => (
              <button
                key={s}
                className={"chip" + (s === seasonKey ? " chip-active" : "")}
                onClick={() => setSeasonKey(s)}
              >
                {s}
              </button>
            ))}
          </div>
        </div>

        <div className="control-group">
          <span className="control-label">Confronta anni</span>
          <div className="selects">
            <select value={yearA} onChange={(e) => setYearA(Number(e.target.value))}>
              {YEARS.map((y) => <option key={y} value={y}>{y}</option>)}
            </select>
            <span className="vs">vs</span>
            <select value={yearB} onChange={(e) => setYearB(Number(e.target.value))}>
              {YEARS.map((y) => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>

        <div className="control-group">
          <span className="control-label">Confronta con citt&agrave;</span>
          <select value={cityKey} onChange={(e) => setCityKey(e.target.value)}>
            <option value="">Nessuna</option>
            {Object.keys(CITY_NORMALS).map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>

        <div className="control-group export-group">
          <span className="control-label">Esporta</span>
          <div className="chips">
            <button className="chip chip-outline" onClick={handleExportCSV}>Dati (CSV)</button>
            <button className="chip chip-outline" onClick={() => handleExportPNG(climoRef, "firenze-climografo.png")}>Climografo (PNG)</button>
          </div>
        </div>
      </section>
      {exportMsg && <div className="export-msg">{exportMsg}</div>}

      <section className="main-grid">
        <div className="panel climo-panel" ref={climoRef}>
          <div className="panel-head">
            <h2>Climografo comparativo</h2>
            <p className="panel-sub">Barre = pioggia mensile &middot; linee = temperatura media. Periodo evidenziato: {seasonKey.toLowerCase()}.</p>
          </div>
          <ResponsiveContainer width="100%" height={380}>
            <ComposedChart data={climoData} margin={{ top: 8, right: 16, left: 0, bottom: 0 }}>
              <CartesianGrid stroke="#E4D9C3" vertical={false} />
              {seasonKey !== "Anno intero" && climoData.map((row, idx) =>
                row.inSeason ? (
                  <ReferenceArea key={idx} x1={row.month} x2={row.month} fill="#B5502E" fillOpacity={0.06} />
                ) : null
              )}
              <XAxis dataKey="month" tick={{ fill: "#5B4B39", fontSize: 12 }} axisLine={{ stroke: "#C9BB9E" }} tickLine={false} />
              <YAxis yAxisId="temp" tick={{ fill: "#5B4B39", fontSize: 12 }} axisLine={false} tickLine={false} width={34} unit="°" />
              <YAxis yAxisId="rain" orientation="right" tick={{ fill: "#5B4B39", fontSize: 12 }} axisLine={false} tickLine={false} width={34} unit="mm" />
              <Tooltip content={<ClimoTooltip />} />
              <Legend wrapperStyle={{ fontSize: 12, color: "#5B4B39" }} />
              <Bar yAxisId="rain" dataKey="pioggiaA" name={"Pioggia " + yearA} fill="#7C8A5C" radius={[3,3,0,0]} barSize={10} />
              <Bar yAxisId="rain" dataKey="pioggiaB" name={"Pioggia " + yearB} fill="#B7C08E" radius={[3,3,0,0]} barSize={10} />
              {cityKey && <Line yAxisId="rain" type="monotone" dataKey="pioggiaCity" name={"Pioggia " + cityKey} stroke="#9AA7C7" strokeWidth={1.5} strokeDasharray="2 3" dot={false} />}
              <Line yAxisId="temp" type="monotone" dataKey="tmedNorm" name="Normale 1991-2020" stroke="#8A7960" strokeWidth={1.5} strokeDasharray="4 3" dot={false} />
              <Line yAxisId="temp" type="monotone" dataKey="tmedA" name={"Temp. " + yearA} stroke="#B5502E" strokeWidth={2.5} dot={{ r: 3 }} />
              <Line yAxisId="temp" type="monotone" dataKey="tmedB" name={"Temp. " + yearB} stroke="#C99A3B" strokeWidth={2.5} dot={{ r: 3 }} />
              {cityKey && <Line yAxisId="temp" type="monotone" dataKey="tmedCity" name={"Temp. " + cityKey} stroke="#4A5A78" strokeWidth={1.5} strokeDasharray="1 3" dot={false} />}
            </ComposedChart>
          </ResponsiveContainer>
        </div>

        <div className="kpi-stack">
          <KpiRow label={"T media &middot; " + seasonKey} a={fmt1(kpi.tmedA) + "°"} b={fmt1(kpi.tmedB) + "°"} yearA={yearA} yearB={yearB}
            note={"Normale: " + fmt1(kpi.tmedNorm) + "°" + (cityKey ? " &middot; " + cityKey + ": " + fmt1(kpi.tmedCity) + "°" : "")} />
          <KpiRow label={"Pioggia totale &middot; " + seasonKey} a={fmt0(kpi.pioggiaA) + " mm"} b={fmt0(kpi.pioggiaB) + " mm"} yearA={yearA} yearB={yearB}
            note={"Normale: " + fmt0(kpi.pioggiaNorm) + " mm" + (cityKey ? " &middot; " + cityKey + ": " + fmt0(kpi.pioggiaCity) + " mm" : "")} />
          <KpiRow label={"Giorni di pioggia &middot; " + seasonKey} a={fmt0(kpi.giorniA)} b={fmt0(kpi.giorniB)} yearA={yearA} yearB={yearB}
            note={"Normale: " + fmt0(kpi.giorniNorm) + " gg"} />
          <KpiRow label="Ondate di calore (stagione)" a={String(wavesA)} b={String(wavesB)} yearA={yearA} yearB={yearB}
            note="Somma episodi &gt;3 giorni consecutivi con Tmax elevata" />
          <KpiRow label="Ondate di freddo (stagione)" a={String(wavesAcold)} b={String(wavesBcold)} yearA={yearA} yearB={yearB}
            note="Somma episodi &gt;3 giorni consecutivi con Tmin rigida" />
        </div>
      </section>

      <section className="panel trend-panel" ref={trendRef}>
        <div className="panel-head panel-head-row">
          <div>
            <h2>Tendenza e proiezione</h2>
            <p className="panel-sub">
              Regressione lineare su T media annua 1991&ndash;2020: {trend.reg.slope >= 0 ? "+" : ""}{fmt1(trend.reg.slope * 10)}&nbsp;&deg;C/decennio
              &middot; R&sup2;&nbsp;{trend.reg.r2.toFixed(2)}
            </p>
          </div>
          <div className="proj-controls">
            <span className="control-label">Proietta</span>
            {[5, 10, 20].map((n) => (
              <button key={n} className={"chip" + (n === projYears ? " chip-active" : "")} onClick={() => setProjYears(n)}>
                +{n} anni
              </button>
            ))}
            <button className="chip chip-outline" onClick={() => handleExportPNG(trendRef, "firenze-trend-proiezione.png")}>PNG</button>
          </div>
        </div>
        <ResponsiveContainer width="100%" height={300}>
          <ComposedChart data={trendData} margin={{ top: 8, right: 16, left: 0, bottom: 0 }}>
            <CartesianGrid stroke="#E4D9C3" vertical={false} />
            <XAxis dataKey="year" tick={{ fill: "#5B4B39", fontSize: 12 }} axisLine={{ stroke: "#C9BB9E" }} tickLine={false} />
            <YAxis tick={{ fill: "#5B4B39", fontSize: 12 }} axisLine={false} tickLine={false} width={34} unit="°" domain={["auto", "auto"]} />
            <Tooltip content={<TrendTooltip />} />
            <ReferenceLine x={trend.lastYear} stroke="#8A7960" strokeDasharray="3 3" label={{ value: "oggi", position: "insideTopRight", fill: "#8A7960", fontSize: 11 }} />
            <Legend wrapperStyle={{ fontSize: 12, color: "#5B4B39" }} />
            <Scatter dataKey="actual" name="T media osservata" fill="#B5502E" />
            <Line dataKey="fit" name="Retta di tendenza" stroke="#8A7960" strokeWidth={2} dot={false} />
            <Line dataKey="projected" name={"Proiezione (+" + projYears + " anni)"} stroke="#4A5A78" strokeWidth={2} strokeDasharray="6 4" dot={false} />
          </ComposedChart>
        </ResponsiveContainer>
        <p className="footnote">
          Proiezione statistica per estrapolazione lineare della serie storica, non una previsione meteorologica:
          non tiene conto di eventuali cambi di regime climatico, variabilit&agrave; naturale o scenari di emissione.
        </p>
      </section>

      <section className="panel extremes-panel">
        <div className="panel-head">
          <h2>Estremi e anni record</h2>
          <p className="panel-sub">Calcolati sull&rsquo;intera serie 1991&ndash;2020, indipendentemente dal filtro stagionale.</p>
        </div>
        <dl className="extremes-list">
          <div className="ext-row"><dt>Anno pi&ugrave; caldo</dt><dd>{extremes.hottest.year} &middot; {fmt1(extremes.hottest.v)} &deg;C medi</dd></div>
          <div className="ext-row"><dt>Anno pi&ugrave; freddo</dt><dd>{extremes.coldest.year} &middot; {fmt1(extremes.coldest.v)} &deg;C medi</dd></div>
          <div className="ext-row"><dt>Anno pi&ugrave; piovoso</dt><dd>{extremes.wettest.year} &middot; {fmt0(extremes.wettest.v)} mm</dd></div>
          <div className="ext-row"><dt>Anno pi&ugrave; secco</dt><dd>{extremes.driest.year} &middot; {fmt0(extremes.driest.v)} mm</dd></div>
          <div className="ext-row"><dt>Tmin assoluta</dt><dd>{D.estremi.Tmin_assoluta.val} &deg;C &middot; {D.estremi.Tmin_assoluta.data}</dd></div>
          <div className="ext-row"><dt>Tmax assoluta</dt><dd>{D.estremi.Tmax_assoluta.val} &deg;C &middot; {D.estremi.Tmax_assoluta.data}</dd></div>
          <div className="ext-row"><dt>Continentalit&agrave; di Gorczynski</dt><dd>{D.estremi.indice_continentalita}</dd></div>
        </dl>
      </section>

      <footer className="foot">
        <p>
          Dati Firenze: serie climatica 1991&ndash;2020. Normali di confronto per
          Roma, Milano, Torino, Bologna e Napoli: medie climatiche pubbliche, periodo 1991&ndash;2020, uso indicativo.
        </p>
      </footer>
    </div>
  );
}

function TTRow({ color, label, value, sub }) {
  return (
    <div className="tt-row">
      <span className="tt-dot" style={{ background: color }} />
      <span className="tt-label">{label}</span>
      <span className="tt-value">{value}</span>
      {sub && <span className="tt-sub">{sub}</span>}
    </div>
  );
}

function devLabel(v, norm) {
  const d = v - norm;
  if (Math.abs(d) < 0.05) return "in linea con la normale";
  return (d > 0 ? "+" : "") + fmt1(d) + "° vs normale";
}

function KpiRow({ label, a, b, yearA, yearB, note }) {
  return (
    <div className="kpi-row">
      <div className="kpi-label" dangerouslySetInnerHTML={{ __html: label }} />
      <div className="kpi-values">
        <div className="kpi-val kpi-val-a"><span className="kpi-year">{yearA}</span><span>{a}</span></div>
        <div className="kpi-val kpi-val-b"><span className="kpi-year">{yearB}</span><span>{b}</span></div>
      </div>
      <div className="kpi-note" dangerouslySetInnerHTML={{ __html: note }} />
    </div>
  );
}

function AnomalySpiral({ years, values }) {
  const mean = avg(values);
  const maxAbs = Math.max(...values.map((v) => Math.abs(v - mean)), 0.5);
  const cx = 130, cy = 130;
  const rStart = 22, rStep = (118 - 22) / years.length;
  const colorFor = (d) => {
    const t = d / maxAbs;
    if (t >= 0) {
      return "rgb(" + (181 + Math.round(t*0)) + ", " + Math.round(80 - t*10) + ", " + Math.round(46 - t*10) + ")";
    }
    return "rgb(" + Math.round(124 + t*20) + ", " + Math.round(138 + t*10) + ", " + Math.round(92 + t*10) + ")";
  };
  return (
    <div className="spiral-wrap">
      <svg viewBox="0 0 260 260" className="spiral-svg" role="img" aria-label="Anomalia di temperatura media annua, 1991-2020, un anello per anno">
        {years.map((y, i) => {
          const r = rStart + i * rStep;
          const anomaly = values[i] - mean;
          return (
            <circle key={y} cx={cx} cy={cy} r={r} fill="none"
              stroke={colorFor(anomaly)} strokeWidth={rStep * 0.82} opacity={0.95} />
          );
        })}
        <circle cx={cx} cy={cy} r={rStart - 6} fill="#F4EEE0" />
        <text x={cx} y={cy - 4} textAnchor="middle" className="spiral-center-year">1991</text>
        <text x={cx} y={cy + 12} textAnchor="middle" className="spiral-center-year">&rarr; 2020</text>
      </svg>
      <p className="spiral-caption">Ogni anello &egrave; un anno: rosso = pi&ugrave; caldo della media 1991&ndash;2020, verde = pi&ugrave; freddo.</p>
    </div>
  );
}
